version: 2

# One pull request per month bumping every dependency: GitHub Actions (SHA
# pins and their version comments) and npm in the app, functions/ and the
# CI-only tool lockfiles (.github/firebase-tools, lighthouse).
# Minor and patch versions only: major upgrades are done deliberately.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
    # Let new releases age a week before adopting them (supply-chain safety).
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /functions
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /.github/firebase-tools
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /lighthouse
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
