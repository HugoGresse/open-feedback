name: Deploy to Firebase Hosting on merge

# Same split as the PR previews (firebase-hosting-preview-*.yml):
#  - the build job runs the app's dependency tree and holds no Google
#    credential;
#  - the deploy job only installs firebase-tools (.github/firebase-tools,
#    pinned by its own lockfile, no install scripts) and authenticates
#    keylessly (Workload Identity Federation).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Manual runs only deploy when started from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: what this job builds goes to production.
      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: install dependencies
        run: npm ci
      - name: build the app
        run: npm run build
        # Vite inlines these into the client bundle at build time, so they are
        # PUBLIC in the deployed app — never put server-only secrets here.
        # Without them the deployed app ships an empty Firebase/runtime config.
        env:
          VITE_ADMIN_EMAIL: ${{ secrets.OF_VITE_ADMIN_EMAIL }}
          VITE_RECAPTCHAV3_SITE_KEY: ${{ secrets.OF_VITE_RECAPTCHAV3_SITE_KEY }}
          VITE_APPID: ${{ secrets.OF_VITE_APPID }}
          VITE_API_KEY: ${{ secrets.OF_VITE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ secrets.OF_VITE_AUTH_DOMAIN }}
          VITE_DATABASE_URL: ${{ secrets.OF_VITE_DATABASE_URL }}
          VITE_PROJECT_ID: ${{ secrets.OF_VITE_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ secrets.OF_VITE_STORAGE_BUCKET }}
          VITE_MEASUREMENT_ID: ${{ secrets.OF_VITE_MEASUREMENT_ID }}
          VITE_SMALL_CHAT: ${{ secrets.OF_VITE_SMALL_CHAT }}
          VITE_OPEN_SPONSORS: ${{ secrets.OF_VITE_OPEN_SPONSORS }}
          VITE_EMULATORS: ${{ secrets.OF_VITE_EMULATORS }}
          VITE_API_DOCS_URL: ${{ secrets.OF_VITE_API_DOCS_URL }}
      - name: upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          # Long enough to re-run a failed deploy job on its own.
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    # Production identity. The provider only accepts this workflow, on main,
    # triggered by push or workflow_dispatch, for this repo. The account has
    # Firebase Hosting Admin and API Keys Viewer on open-feedback-42.
    env:
      PROD_PROJECT_ID: open-feedback-42
      PROD_WIF_PROVIDER: projects/635903227116/locations/global/workloadIdentityPools/github-hosting-deploy/providers/open-feedback-main
      PROD_SERVICE_ACCOUNT: gh-prod-deploy@open-feedback-42.iam.gserviceaccount.com
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: jobs that run the app's install scripts can write
      # cache entries, and this job holds the deploy identity.
      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: install firebase-tools
        run: npm ci --prefix .github/firebase-tools --ignore-scripts
      - name: download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.PROD_WIF_PROVIDER }}
          service_account: ${{ env.PROD_SERVICE_ACCOUNT }}
      - name: deploy to Firebase Hosting
        run: .github/firebase-tools/node_modules/.bin/firebase deploy --only hosting --project "$PROD_PROJECT_ID"
