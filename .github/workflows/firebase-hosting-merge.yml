# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Google access is keyless (Workload Identity Federation) once the
# PROD_WIF_PROVIDER and PROD_SERVICE_ACCOUNT repository variables are set. The
# provider only accepts this workflow, on main, for this repository. Until
# then the deploy falls back to the FIREBASE_SERVICE_ACCOUNT_OPEN_FEEDBACK_42
# JSON key; drop that fallback once the key is deleted.
env:
  PROD_PROJECT_ID: open-feedback-42

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: install dependencies
        run: npm ci
      - name: build the app
        run: npm run build
        # Vite inlines these into the client bundle at build time, so they are
        # PUBLIC in the deployed app — never put server-only secrets here.
        # Without them the deployed app ships an empty Firebase/runtime config.
        env:
          VITE_ADMIN_EMAIL: ${{ secrets.OF_VITE_ADMIN_EMAIL }}
          VITE_RECAPTCHAV3_SITE_KEY: ${{ secrets.OF_VITE_RECAPTCHAV3_SITE_KEY }}
          VITE_APPID: ${{ secrets.OF_VITE_APPID }}
          VITE_API_KEY: ${{ secrets.OF_VITE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ secrets.OF_VITE_AUTH_DOMAIN }}
          VITE_DATABASE_URL: ${{ secrets.OF_VITE_DATABASE_URL }}
          VITE_PROJECT_ID: ${{ secrets.OF_VITE_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ secrets.OF_VITE_STORAGE_BUCKET }}
          VITE_MEASUREMENT_ID: ${{ secrets.OF_VITE_MEASUREMENT_ID }}
          VITE_SMALL_CHAT: ${{ secrets.OF_VITE_SMALL_CHAT }}
          VITE_OPEN_SPONSORS: ${{ secrets.OF_VITE_OPEN_SPONSORS }}
          VITE_EMULATORS: ${{ secrets.OF_VITE_EMULATORS }}
          VITE_API_DOCS_URL: ${{ secrets.OF_VITE_API_DOCS_URL }}

      - name: authenticate to Google Cloud
        if: vars.PROD_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_SERVICE_ACCOUNT }}
      - name: deploy to Firebase Hosting
        if: vars.PROD_WIF_PROVIDER != ''
        run: node_modules/.bin/firebase deploy --only hosting --project "$PROD_PROJECT_ID" --non-interactive

      - name: deploy to Firebase Hosting (JSON key fallback)
        if: vars.PROD_WIF_PROVIDER == ''
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPEN_FEEDBACK_42 }}
          channelId: live
          projectId: ${{ env.PROD_PROJECT_ID }}
