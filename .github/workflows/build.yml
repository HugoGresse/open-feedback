name: Build project + unit test

# Branches of this repository are tested on push. Pull requests from forks
# never trigger `push` here, so they are tested through `pull_request`: the
# job then runs with a read-only token and no secrets, and GitHub holds each
# run until a maintainer approves it (repository setting "Require approval
# for all external contributors").
on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        # Same-repository PRs are already covered by the push run.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v1
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            # firebase-tools 15.x requires JDK 21+ to run the Firestore emulator
            # used by `npm test`.
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
            - name: npm install (ci)
              run: |
                  npm ci
            - name: npm build
              run: |
                  npm run build
            - name: npm lint:i18n
              run: |
                  npm run lint:i18n
            - name: functions npm install (ci)
              working-directory: ./functions
              run: npm ci
            - name: npm test (Firestore rules and functions/)
              run: |
                  npm run test
            - name: build functions/
              working-directory: ./functions
              run: npm run build
            - name: run lighthouse ci
              run: |
                  npm install -g @lhci/cli@0.14.x
                  lhci autorun --config=./lighthouse/lighthouserc.json
              env:
                  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
