name: Build PR preview

# Step 1 of 2 for PR previews. Builds every pull request (forks included)
# with no secrets and a read-only token, and uploads the static site as an
# artifact. It never deploys: firebase-hosting-preview-deploy.yml picks the
# artifact up from a trusted context and treats it as plain data.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Dependabot bumps don't need a preview.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: install dependencies
        run: npm ci
      # Uses .env.preview (sandbox project, public values only).
      - name: build the app for the preview project
        run: npx vite build --mode preview
      - name: upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
