name: Deploy PR preview

# Step 2 of 2 for PR previews. Runs from the default branch (trusted code)
# after "Build PR preview" succeeds, and deploys the built site to a Firebase
# Hosting preview channel on the open-feedback-hugo sandbox project:
#  - no pull request code runs here: the artifact is only uploaded as data;
#  - Google access is keyless (Workload Identity Federation). The provider only
#    accepts this workflow, on main, triggered by workflow_run, for this repo,
#    and the service account can only deploy Hosting on the sandbox project;
#  - fork previews wait for a maintainer to approve the
#    `external-contributors` environment, so nobody can publish arbitrary
#    content on the preview domain unreviewed.
on:
  workflow_run:
    workflows: [Build PR preview]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  PREVIEW_PROJECT_ID: open-feedback-hugo

jobs:
  deploy:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_repository.full_name != github.repository && 'external-contributors' || '' }}
    permissions:
      contents: read
      actions: read # download the artifact of the build run
      id-token: write # Workload Identity Federation
      pull-requests: write # comment the preview URL
    steps:
      # workflow_run.pull_requests is empty for forks: resolve the PR from the
      # head branch and only accept it if it still points at the built commit.
      - name: find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq "map(select(.head.sha == \"$HEAD_SHA\")) | .[0].number // empty")
          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            echo "::notice::No open pull request at $HEAD_SHA (closed or updated since the build); skipping."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: check out the default branch
        if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Node.js
        if: steps.pr.outputs.number
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      # Installs firebase-tools from the default branch's lockfile.
      - name: install dependencies
        if: steps.pr.outputs.number
        run: npm ci

      - name: download the built site
        if: steps.pr.outputs.number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: inject the preview web API key
        if: steps.pr.outputs.number
        env:
          API_KEY: ${{ vars.PREVIEW_FIREBASE_API_KEY }}
        run: |
          [[ "$API_KEY" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::PREVIEW_FIREBASE_API_KEY variable is missing or invalid"; exit 1; }
          grep -rlF --include='*.js' '__PREVIEW_FIREBASE_API_KEY__' dist | xargs -r sed -i "s/__PREVIEW_FIREBASE_API_KEY__/$API_KEY/g"

      - name: authenticate to Google Cloud
        if: steps.pr.outputs.number
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/751966180641/locations/global/workloadIdentityPools/github/providers/open-feedback-repo
          service_account: gh-preview-deploy@open-feedback-hugo.iam.gserviceaccount.com

      - name: deploy the preview channel
        id: deploy
        if: steps.pr.outputs.number
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          npx firebase hosting:channel:deploy "pr-$PR_NUMBER" \
            --project "$PREVIEW_PROJECT_ID" --expires 7d --json > deploy.json
          url=$(jq -r '[.result[]?.url] | first // empty' deploy.json)
          [[ -n "$url" ]] || { cat deploy.json; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: comment the preview URL on the pull request
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          marker='<!-- firebase-preview -->'
          body=$(printf '%s\nPreview for %s (sandbox project %s, expires in 7 days): %s' \
            "$marker" "${HEAD_SHA:0:7}" "$PREVIEW_PROJECT_ID" "$URL")
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))) | .[0].id // empty" | head -n1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
